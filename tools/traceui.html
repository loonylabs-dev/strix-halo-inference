<!doctype html>
<meta charset="utf-8">
<title>cc-gateway trace</title>
<!--
  One file, no build, no dependency, nothing loaded from anywhere. It is
  served by `python3 tools/tracelog.py serve` on 127.0.0.1 and reads the
  gateway's JSONL trace through two endpoints:

      /events?file=&since=   everything after a byte offset, text REDACTED
      /record?file=&at=      one row, in full — only when a row is clicked

  The redaction is the point of the split: a table that ships whole prompts to
  the browser by default is one port-forward away from being a leak. What the
  row shows is that there IS text and how much; the click asks for it.
-->
<style>
  :root {
    --bg:#12141a; --fg:#e6e8ee; --dim:#8b93a7; --line:#262a35;
    --cold:#e0913a; --warm:#4a9d6a; --bad:#d1495b; --acc:#5b8dd6;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg:#fbfbfd; --fg:#1b1e26; --dim:#6b7280; --line:#e3e6ee;
            --cold:#b4651a; --warm:#2f7a4d; --bad:#b3213a; --acc:#2f5fa8; }
  }
  * { box-sizing:border-box }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace }
  header { position:sticky; top:0; background:var(--bg); border-bottom:1px solid var(--line);
           padding:10px 14px; display:flex; gap:14px; align-items:center; flex-wrap:wrap }
  h1 { font-size:13px; margin:0 10px 0 0; font-weight:600; letter-spacing:.02em }
  input,select,button { background:transparent; color:var(--fg); border:1px solid var(--line);
                        border-radius:5px; padding:4px 8px; font:inherit }
  button { cursor:pointer } button:hover { border-color:var(--acc) }
  button.on { border-color:var(--acc); color:var(--acc) }
  .sp { flex:1 } .dim { color:var(--dim) }
  table { border-collapse:collapse; width:100%; }
  th,td { text-align:left; padding:3px 10px; border-bottom:1px solid var(--line);
          white-space:nowrap; }
  /* --hh is measured, not guessed: the header wraps to two lines on a narrow
     window, and a hard-wired offset then leaves the column titles sitting on
     top of the filters. Seen in a screenshot, 29.08. */
  th { position:sticky; top:var(--hh,47px); background:var(--bg); color:var(--dim);
       font-weight:500 }
  tbody tr { cursor:pointer } tbody tr:hover { background:rgba(127,127,127,.10) }
  td.num { text-align:right; font-variant-numeric:tabular-nums }
  .cold { color:var(--cold) } .warm { color:var(--warm) } .bad { color:var(--bad) }
  .kind { color:var(--dim) }
  .bar { display:inline-block; height:9px; vertical-align:middle; border-radius:2px }
  .bar-r { background:var(--warm) } .bar-c { background:var(--cold) }
  pre { margin:0; padding:10px 14px; white-space:pre-wrap; word-break:break-word;
        background:rgba(127,127,127,.07); border-left:2px solid var(--acc) }
  .empty { padding:30px 14px; color:var(--dim) }
  #charts { display:grid; gap:2px; padding:10px 14px 4px }
  figure { margin:0 } figcaption { color:var(--fg); font-size:11px; padding:6px 0 2px }
  svg { width:100%; height:auto; display:block; background:rgba(127,127,127,.05);
        border:1px solid var(--line); border-radius:5px }
  svg text { fill:var(--dim); font-size:9px }
  svg .grid { stroke:var(--line); stroke-width:1 }
  svg .pt { cursor:pointer } svg .pt:hover { stroke:var(--acc); stroke-width:2 }
</style>

<header>
  <h1>cc-gateway trace</h1>
  <select id=day></select>
  <input id=q placeholder="filter: slug, prefix, who, mode…" size=26>
  <select id=kind>
    <option value="">alle Arten</option>
    <option>request</option><option>save</option><option>restore</option>
    <option>quarantine</option><option>mismatch</option>
  </select>
  <button id=live class=on>live</button>
  <button id=charts-btn class=on>Charts</button>
  <span class=sp></span>
  <span class=dim id=meta></span>
</header>
<section id=charts>
  <figure><figcaption>Dauer je Anfrage <span class=dim>· logarithmisch, Farbe = kalt/warm</span></figcaption>
    <svg id=c-dur viewBox="0 0 1000 150" preserveAspectRatio=none></svg></figure>
  <figure><figcaption>Tokens je Anfrage <span class=dim>· grün wiederverwendet, orange gerechnet</span></figcaption>
    <svg id=c-tok viewBox="0 0 1000 120" preserveAspectRatio=none></svg></figure>
  <figure><figcaption>je Prefix <span class=dim>· Anfragen und gerechnete Tokens</span></figcaption>
    <svg id=c-pre viewBox="0 0 1000 130" preserveAspectRatio=none></svg></figure>
</section>
<table>
  <thead><tr>
    <th>Zeit</th><th>Art</th><th>wer</th><th>Client</th><th>slug</th><th>served/mode</th>
    <th>prefix</th><th></th><th class=num>s</th>
    <th class=num>in</th><th class=num>Cache</th><th class=num>out</th><th class=num>t/s r·w</th><th>Anteil</th>
  </tr></thead>
  <tbody id=rows></tbody>
</table>
<div class=empty id=empty>nichts geladen</div>

<script>
const MAX_ROWS = 2000;          // a live view must not grow forever
let file = null, offset = 0, records = [], live = true, openAt = null;

const $ = s => document.querySelector(s);
const clock = t => new Date(t * 1000).toLocaleTimeString();
const esc = s => String(s ?? "").replace(/[<&]/g, c => c === "<" ? "&lt;" : "&amp;");

function matches(r) {
  const k = $("#kind").value, q = $("#q").value.trim().toLowerCase();
  if (k && r.kind !== k) return false;
  if (!q) return true;
  return JSON.stringify(r).toLowerCase().includes(q);
}

// reused against computed, as a bar. A row that is almost all green reused its
// prefix; a warm row that is all orange is the defect of 28.08. — the gateway
// said warm and the server computed everything.
function bar(r) {
  const a = r.reused, b = r.computed;
  if (typeof a !== "number" || typeof b !== "number") return "";
  const tot = Math.max(a + b, 1), w = 90;
  const lie = r.cold === false && a * 4 < b;
  return `<span class="bar bar-r" style="width:${Math.round(w * a / tot)}px"></span>` +
         `<span class="bar bar-c" style="width:${Math.max(1, Math.round(w * b / tot))}px"></span>` +
         (lie ? ` <span class=bad>warm?</span>` : "");
}

// WHICH PROGRAM asked. `who` is the access and says martin-pc2 for everything
// that machine runs; the dialect, the path and the user-agent are what tell
// Claude Code from a harness. Kept as a guess with the raw string on hover,
// because a label that pretends to be certain is worse than one that does not.
// What the prompt cost as INPUT, and how much of it the cache carried. The
// two numbers the gateway reports are `reused` (came from a cache) and
// `computed` (had to be prefilled); their sum is the input the model saw, and
// that sum is what a client's own "input tokens" counter shows — which is why
// a session of 35 turns reads as hundreds of thousands while the context
// never left 39k.
const inTok = r => (r.reused == null && r.computed == null) ? null
                 : (r.reused || 0) + (r.computed || 0);
function share(r) {
  const t = inTok(r);
  if (!t || r.reused == null) return "";
  return Math.round(100 * r.reused / t) + "%";
}

// Read and write rates, and ONLY where llama.cpp measured them itself. The
// Anthropic route carries no timings, so Claude Code rows stay empty here —
// an empty cell is the honest answer. A rate computed from the total duration
// would be neither the prefill nor the decode.
function rates(r) {
  if (r.read_tps == null && r.write_tps == null) return "";
  const f = v => v == null ? "–" : Math.round(v);
  return `${f(r.read_tps)}·${f(r.write_tps)}`;
}

function client(r) {
  const ua = (r.ua || "").toLowerCase();
  if (ua.includes("claude-cli") || ua.includes("claude-code")) return "claude-code";
  if (ua.includes("node")) return "node";
  if (ua.includes("python") || ua.includes("urllib") || ua.includes("httpx")) return "python";
  if (ua.includes("curl")) return "curl";
  if (r.dialect === "openai" || (r.path || "").includes("chat/completions")) return "oai-client";
  if (r.dialect === "anthropic" || (r.path || "").includes("/messages")) return "anthropic-client";
  return "";
}

// Token columns belong to REQUESTS. A save or a restore has tokens too, but
// they mean something else — and a record written before 29.08. carries
// prewarm's console output under `output`, which is how a paragraph of text
// ended up in a number column on screen. Everything else the row does not
// understand stays in the detail view, where it is labelled.
function tokensOf(r) {
  return typeof r.tokens === "number" ? r.tokens : "";
}

function row(r, i) {
  const req = r.kind === "request";
  const cold = r.kind !== "request" ? "" :
        (r.cold ? `<span class=cold>COLD</span>` : `<span class=warm>warm</span>`);
  const mode = r.mode ? `${esc(r.served || "")}/<b>${esc(r.mode)}</b>` : "";
  const slugBad = r.kind === "request" && r.mode === "bare" && r.slug &&
                  r.slug !== r.served;
  return `<tr data-i="${i}">
    <td>${clock(r.t)}</td>
    <td class=kind>${esc(r.kind)}</td>
    <td>${esc(r.who || "")}</td>
    <td class=dim title="${esc(r.ua || "")}">${esc(client(r))}</td>
    <td class="${slugBad ? "bad" : ""}">${esc(r.slug || r.model || "")}</td>
    <td class=dim>${mode}</td>
    <td class=dim>${esc(r.prefix || r.file || "")}</td>
    <td>${cold}</td>
    <td class=num>${r.took_s ?? r.saved_s ?? ""}</td>
    <td class=num>${req ? (inTok(r) ?? "") : tokensOf(r)}</td>
    <td class=num>${req ? share(r) : ""}</td>
    <td class=num>${req ? (r.output ?? "") : ""}</td>
    <td class=num title="gemessen vom Server; die Anthropic-Route liefert keine Zeiten">${rates(r)}</td>
    <td>${bar(r)}</td></tr>` +
    (openAt === r._at ? `<tr><td colspan=14><pre id=detail>lädt …</pre></td></tr>` : "");
}

// ---- charts -------------------------------------------------------------
//
// Hand-drawn SVG, because this repo has no npm and is not getting one for
// three pictures. They read the SAME filtered rows as the table, so a filter
// narrows both — a chart that shows something else than the list underneath
// it is how a wrong conclusion gets drawn.

const svgNS = "http://www.w3.org/2000/svg";
function el(tag, attrs, parent) {
  const n = document.createElementNS(svgNS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
}
function clear(id) { const s = $(id); s.innerHTML = ""; return s; }

// Durations span 0.6 s to 337 s in one morning, so a linear axis hides
// everything below a minute. Log, with the decades drawn.
function drawDurations(rows) {
  const s = clear("#c-dur"), W = 1000, H = 150, P = 22;
  const pts = rows.filter(r => r.kind === "request" && r.took_s > 0);
  if (!pts.length) return;
  const t0 = pts[0].t, t1 = pts[pts.length - 1].t || t0 + 1;
  const x = t => P + (W - P - 6) * (t1 === t0 ? 0.5 : (t - t0) / (t1 - t0));
  const lo = Math.log10(0.3), hi = Math.log10(Math.max(...pts.map(r => r.took_s), 10));
  const y = v => H - 16 - (H - 30) * (Math.log10(Math.max(v, 0.3)) - lo) / (hi - lo);
  for (let d = Math.ceil(lo); d <= hi; d++) {
    const v = Math.pow(10, d);
    el("line", {class: "grid", x1: P, x2: W - 6, y1: y(v), y2: y(v)}, s);
    el("text", {x: 2, y: y(v) + 3}, s).textContent = v >= 1 ? v + "s" : v + "s";
  }
  for (const r of pts) {
    const c = el("circle", {class: "pt", cx: x(r.t), cy: y(r.took_s), r: 3,
                            fill: r.cold ? "var(--cold)" : "var(--warm)",
                            "data-at": r._at}, s);
    el("title", {}, c).textContent =
      `${clock(r.t)}  ${r.slug || r.model || ""}  ${r.took_s}s  ` +
      `reused ${r.reused ?? "?"} / computed ${r.computed ?? "?"}`;
  }
}

// What the GPU actually did, next to what it was spared. A tall orange bar is
// work; a tall green one is the cache earning its disk.
function drawTokens(rows) {
  const s = clear("#c-tok"), W = 1000, H = 120, P = 22;
  const pts = rows.filter(r => r.kind === "request" &&
                              (r.reused != null || r.computed != null));
  if (!pts.length) return;
  const max = Math.max(...pts.map(r => (r.reused || 0) + (r.computed || 0)), 1);
  const bw = Math.max(1, Math.min(9, (W - P - 6) / pts.length - 1));
  pts.forEach((r, i) => {
    const x = P + i * ((W - P - 6) / pts.length);
    const hr = (H - 18) * (r.reused || 0) / max;
    const hc = (H - 18) * (r.computed || 0) / max;
    const g = el("g", {class: "pt", "data-at": r._at}, s);
    el("rect", {x, y: H - 12 - hr - hc, width: bw, height: hc,
                fill: "var(--cold)"}, g);
    el("rect", {x, y: H - 12 - hr, width: bw, height: hr,
                fill: "var(--warm)"}, g);
    el("title", {}, g).textContent =
      `${clock(r.t)}  reused ${r.reused ?? "?"} · computed ${r.computed ?? "?"}`;
  });
  el("text", {x: 2, y: 12}, s).textContent = max.toLocaleString();
}

// One row per prefix: how often it was asked for, and what it cost in tokens
// the GPU had to compute. The two together say whether a prefix earns its
// gigabyte.
function drawPrefixes(rows) {
  const s = clear("#c-pre"), W = 1000, H = 130, P = 120;
  const per = new Map();
  for (const r of rows) {
    if (r.kind !== "request" || !r.prefix) continue;
    const e = per.get(r.prefix) || {n: 0, comp: 0, cold: 0, slug: r.slug || r.model};
    e.n++; e.comp += r.computed || 0; e.cold += r.cold ? 1 : 0;
    per.set(r.prefix, e);
  }
  const list = [...per.entries()].sort((a, b) => b[1].comp - a[1].comp).slice(0, 8);
  if (!list.length) return;
  const maxC = Math.max(...list.map(([, e]) => e.comp), 1);
  const rowH = Math.min(14, (H - 8) / list.length);
  list.forEach(([pid, e], i) => {
    const y = 4 + i * rowH;
    el("text", {x: 2, y: y + rowH - 4}, s).textContent =
      `${pid.slice(0, 10)} ${e.n}×${e.cold ? " " + e.cold + " kalt" : ""}`;
    const g = el("g", {class: "pt"}, s);
    el("rect", {x: P, y: y + 1, width: Math.max(1, (W - P - 60) * e.comp / maxC),
                height: rowH - 3, fill: "var(--cold)", opacity: .85}, g);
    el("title", {}, g).textContent =
      `${pid}  ${e.slug || ""}  ${e.n} Anfragen, ${e.comp.toLocaleString()} Tokens gerechnet`;
    el("text", {x: W - 56, y: y + rowH - 4}, s).textContent = e.comp.toLocaleString();
  });
}

function drawCharts(rows) {
  if ($("#charts").style.display === "none") return;
  drawDurations(rows); drawTokens(rows); drawPrefixes(rows);
}

let listed = [];            // exactly what the table shows, newest first

function render() {
  // The charts read TIME, so they stay chronological; the table is read from
  // the top, so the newest belongs there. Two orders, one set of rows — and
  // the click handler uses `listed`, so the two can never drift apart.
  const shown = records.filter(matches).slice(-MAX_ROWS);
  listed = [...shown].reverse();
  $("#rows").innerHTML = listed.map(row).join("");
  $("#empty").style.display = shown.length ? "none" : "block";
  $("#meta").textContent = `${shown.length}/${records.length} Zeilen · ${file || ""}`;
  drawCharts(shown);
  if (openAt !== null) loadDetail();
}

async function loadDetail() {
  const el = $("#detail"); if (!el) return;
  const r = await fetch(`/record?file=${encodeURIComponent(file)}&at=${openAt}`);
  const d = await r.json();
  el.textContent = JSON.stringify(d, null, 2);
}

document.addEventListener("click", e => {
  // A point in a chart opens the same detail as its row — otherwise the
  // picture shows an outlier and leaves you searching the table for it.
  const pt = e.target.closest("[data-at]");
  if (pt) {
    const at = +pt.getAttribute("data-at");
    openAt = (openAt === at) ? null : at;
    render();
    return;
  }
  const tr = e.target.closest("tbody tr[data-i]");
  if (!tr) return;
  const rec = listed[+tr.dataset.i];
  openAt = (openAt === rec._at) ? null : rec._at;      // click again to close
  render();
});

async function poll(force) {
  // Not polling while nobody looks is the whole point of the visibility
  // check — but the FIRST load has to happen anyway, or a tab opened in the
  // background stays empty and looks broken.
  if (!force && (!live || document.visibilityState !== "visible")) return;
  const u = `/events?since=${offset}` + (file ? `&file=${encodeURIComponent(file)}` : "");
  const d = await (await fetch(u)).json();
  file = d.file; offset = d.offset;
  if (d.records.length) {
    records = records.concat(d.records.filter(r => r.kind !== "header"));
    if (records.length > MAX_ROWS * 2) records = records.slice(-MAX_ROWS);
    render();
  }
  document.title = `trace · ${d.level}`;
}

async function days() {
  const d = await (await fetch("/days")).json();
  $("#day").innerHTML = d.days.map(x =>
    `<option${x === file ? " selected" : ""}>${x}</option>`).join("");
}

$("#day").onchange = e => { file = e.target.value; offset = 0; records = []; render(); poll(); };
$("#charts-btn").onclick = () => {
  const on = $("#charts").style.display !== "none";
  $("#charts").style.display = on ? "none" : "grid";
  $("#charts-btn").classList.toggle("on", !on);
  if (on === false) render();
};
$("#q").oninput = render;
$("#kind").onchange = render;
$("#live").onclick = () => { live = !live; $("#live").classList.toggle("on", live);
                             $("#live").textContent = live ? "live" : "pausiert"; if (live) poll(); };
// Scrolling away pauses by itself: nothing is worse than a row that jumps
// while it is being read.
addEventListener("scroll", () => {
  if (window.scrollY > 200 && live) $("#live").click();
}, { passive: true });

// Coming back to the tab shows the current state at once rather than after
// the next tick.
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && live) poll();
});
// A ResizeObserver rather than a resize listener: the header changes height
// when it WRAPS, and it wraps for reasons a window resize never reports — a
// zoom, a longer filename in the day picker, a different font. Measured 51 px
// while the header was 93, in a screenshot, because the listener had not
// fired.
function measureHeader() {
  const el = document.querySelector("header");
  document.documentElement.style.setProperty("--hh", el.offsetHeight + "px");
}
new ResizeObserver(measureHeader).observe(document.querySelector("header"));
measureHeader();
days(); poll(true); setInterval(poll, 2000);
</script>
