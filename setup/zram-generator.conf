# Compressed swap on this machine — 4 GiB, down from the Fedora default of 8.
#
# Install:  sudo install -m644 setup/zram-generator.conf /etc/systemd/zram-generator.conf
#           sudo systemctl restart systemd-zram-setup@zram0.service
#
# Why smaller, and why not zero.
#
# zram is swap that LIVES IN RAM: it compresses pages in place. That is a good
# trade on a machine whose pressure comes from ordinary anonymous memory. It is
# the wrong trade here, and 26.08.2026 showed why twice in one day.
#
# The pressure on this box comes from GTT — the memory amdgpu takes out of
# system RAM for model weights. GTT is PINNED: not swappable, not compressible,
# invisible to the usual accounting. When a model holds 87 GiB of it, zram has
# nothing it can win. It only takes RAM away to store compressed copies of
# pages the kernel could otherwise simply have dropped, and it DELAYS the
# decision — the kernel spends its time compressing and thrashing instead of
# failing fast. That is how a clean allocation failure became a ten-minute
# freeze that took every process with it and left no log.
#
# So why keep any. Swap still has one job here that nothing else does: give
# the kernel somewhere to put genuinely cold anonymous pages — the browser tab
# from this morning — so that the DESKTOP survives a burst long enough for a
# human to react. 4 GiB does that for a desktop.
#
# And deliberately NO disk swap. It was considered and rejected: with the GTT
# cap restored to 108 GiB an over-large model now fails to ALLOCATE, cleanly,
# which is the outcome we want. A large disk swap would replace that clean
# failure with a machine that crawls instead — slower to notice, worse to
# recover, and it would have made both of this day's incidents last longer
# rather than not happen.
#
# 4 rather than 1-2 on purpose: a middle step. If it turns out to be too much
# it can come down again, and the number that matters is measurable —
# `zramctl` shows how much is actually in use.
[zram0]
zram-size = 4096
